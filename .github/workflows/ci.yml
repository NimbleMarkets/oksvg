name: CI

on:
  push:
    branches: [master, main, nm]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        # Use Intel macOS while hosted ARM64 runners have capacity constraints.
        os: [ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: gofmt
        run: |
          fmt_files="$(gofmt -l . | grep -v '^\.claude/' | tee /dev/stderr | wc -l)"
          test "$fmt_files" -eq 0

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race ./...
